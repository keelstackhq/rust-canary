# Keys whose signed `/bosun approve` comments count as an owner approval (bosun spec §8, signed
# approvals). risk-check reads this file from the default branch only, never from a PR, so a PR
# cannot enrol its own key. Enrol or rotate a key with a PR the owner approves on GitHub.
# `role` is `owner` (the default) or `delegate`. `ed25519` is the base64 of the raw 32-byte
# public key:
#   openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | base64

[[key]]
